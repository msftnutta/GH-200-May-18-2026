name: CI / CD

# Orchestrator workflow. The actual work lives in reusable workflows
# (files prefixed with "_") and is wired together here via `needs:`.
#
# Trigger reference:
#   push                 - runs on commits to the listed branches
#   pull_request         - runs on PRs targeting the listed branches
#   workflow_dispatch    - lets you trigger manually from the Actions tab
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# These permissions cascade to called reusable workflows that need them.
permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write   # so CodeQL can upload SARIF results

jobs:
  # 1. Install deps + build CSS
  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    with:
      node-version: '20.x'
      # To use a self-hosted runner instead, uncomment:
      # runs-on: '["self-hosted", "surface-laptop"]'

  # 2. Tests (runs in parallel with build for faster feedback)
  test:
    name: Test
    uses: ./.github/workflows/_test.yml
    with:
      node-version: '20.x'

  # 3. Static security analysis (runs in parallel with build/test)
  codeql:
    name: CodeQL
    uses: ./.github/workflows/_codeql.yml

  # 4. Build & publish Docker image to GHCR
  #    Gated by the "publish-approval" Environment, which is configured (in
  #    repo Settings -> Environments) to require a reviewer. The job waits
  #    here until an approver clicks "Approve and deploy" in the Actions UI.
  publish-image:
    name: Publish image
    needs: [build, test, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_publish-image.yml
    with:
      image-name: ${{ github.repository }}
      environment: publish-approval

  # 5. Deploy to Azure App Service
  #    Gated by the "production" Environment (also configured with required
  #    reviewers). A second approval is required here before deploy runs.
  deploy:
    name: Deploy
    needs: [publish-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      # webapp-name: ${{ vars.AZURE_WEBAPP_NAME }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
