name: CodeQL (scheduled)

# Runs the reusable CodeQL workflow on a weekly schedule so we catch newly
# disclosed query updates even if no code changes have landed.
on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    uses: ./.github/workflows/_codeql.yml
