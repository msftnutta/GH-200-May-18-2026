name: _publish-image

# Reusable workflow: build a Docker image and push it to GitHub Container Registry (GHCR).
# Tags pushed: <image>:latest and <image>:sha-<commit-sha>.
on:
  workflow_call:
    inputs:
      image-name:
        description: Image name. Defaults to the calling repo (owner/repo) if empty.
        type: string
        required: false
        default: ''
      environment:
        description: GitHub Environment to attach to this job (used for manual approval gates)
        type: string
        required: false
        default: ''
      runs-on:
        description: Runner label(s) as a JSON array string
        type: string
        required: false
        default: '["ubuntu-latest"]'

jobs:
  publish-image:
    name: Publish Docker image to GHCR
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: |
          NAME='${{ inputs.image-name }}'
          if [ -z "$NAME" ]; then NAME='${{ github.repository }}'; fi
          echo "name=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:latest
            ghcr.io/${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
