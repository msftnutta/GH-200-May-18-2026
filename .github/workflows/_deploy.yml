name: _deploy

# Reusable workflow: deploy to Azure App Service.
# NOTE: Deployment is currently DISABLED. Uncomment the steps below and add the
# required secrets / inputs when you're ready to go live.
on:
  workflow_call:
    inputs:
      webapp-name:
        description: Azure Web App name
        type: string
        required: false
        default: ''
      environment:
        description: GitHub Environment to deploy into
        type: string
        required: false
        default: 'production'
      runs-on:
        description: Runner label(s) as a JSON array string
        type: string
        required: false
        default: '["ubuntu-latest"]'
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

jobs:
  deploy:
    name: Deploy to Azure App Service (disabled)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
